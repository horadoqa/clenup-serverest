name: Daily Clenup

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y jq make

      - name: Remover usuários
        run: make deletar_ids