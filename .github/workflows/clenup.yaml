name: Daily Clenup

on:
  schedule:
    # 10:00 UTC
    - cron: "0 10 * * *"

  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y jq make

      - name: Executar rotina diária
        run: make rotina_diaria